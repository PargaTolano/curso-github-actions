name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # allow manual run in Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustup + cargo
      - name: Install cargo
        uses: dtolnay/rust-toolchain@v1

      # prevenir redescargado y recompilado de deps
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Code
        run: cargo run