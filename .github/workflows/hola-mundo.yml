name: CI
run-name: Aprendiendo GH Action!
on:
  # allow manual run in Actions tab
  workflow_dispatch:
  # allow other workflows to call this one
  workflow_call:
    inputs:
      greeting:
        description: "A message passed in from the caller"
        type: string
        required: false
        default: "Hola"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust and Cache
        uses: moonrepo/setup-rust@v1

      - name: Define variable
        run: echo "USERNAME=${{ github.actor }}" >> $GITHUB_ENV

      - name: Show Input
        run: echo "${{ inputs.greeting }}, $USERNAME"

      - name: Run Code
        run: cargo run
