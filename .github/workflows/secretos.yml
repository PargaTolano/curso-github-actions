name: name: secretos
run-name: Aprendiendo Secretos en Github Actions
on:
    push:
      branches: [main]
jobs:
    print_secret:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Imprimir nombre
              run: "echo 'HOLA MI ESTIMADO ${{ vars.NOMBRE }} tu pass es: ${{ secrets.PASS }}'"